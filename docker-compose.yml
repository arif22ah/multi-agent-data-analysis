version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omar_analytics
      POSTGRES_PASSWORD: readonly_guard
      POSTGRES_DB: enterprise_dw
    ports:
      - "5432:5432"

  fastapi-nl2sql:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  streamlit-analyst:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-nl2sql
